name: Update ETF dashboard data

# 定时已停用：境外 runner 抓不到中证/东财/国信，会写出缺少 A 股回撤的残数据。
# 数据改由本机每日生成（skill: etf-daily-report），并通过 workflow_dispatch 手动补跑。
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update.yml"  # 改动本文件即触发一次，便于手动重建

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch data and compute metrics
        env:
          GS_API_KEY: ${{ secrets.GS_API_KEY }}
        run: |
          python scripts/fetch_djeva.py
          python scripts/fetch_cn_csindex.py
          python scripts/fetch_hk_hsi.py
          python scripts/fetch_us_yf.py
          python scripts/fetch_theme_csindex.py
          python scripts/compute_metrics.py
          python scripts/build_assets.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets.csv data/raw data/processed || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: data auto-update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
