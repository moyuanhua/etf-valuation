name: Rebuild dashboard from committed history

# 数据由本机（国内网络）每日增量抓取后提交到 data/history；CI 只从已提交数据重算站点，
# 不联网抓数（境外 runner 连不上中证/东财/国信）。日常流程靠 Pages 在 push 时自动重新发布，
# 此工作流用于手动/变更时重算，保证 docs/ 与 history 一致。

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: rebuild-dashboard
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements-ci.txt

      - name: Rebuild metrics & history export
        run: |
          python scripts/compute_metrics.py
          python scripts/build_assets.py
          python scripts/build_history_export.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: rebuild from history $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
